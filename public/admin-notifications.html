<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Notifications</title>
  <link rel="icon" type="image/x-icon" href="image/fevicon/favicon.ico">
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/admin.css" />
  <link rel="stylesheet" href="CSS/dark-mode.css" />
  <link rel="stylesheet" href="CSS/responsive.css">
  <script defer src="https://unpkg.com/feather-icons"></script>
</head>

<body>
  <script>(function () { try { var d = document; var t = localStorage.getItem('hdf-theme'); if (!t) { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } var st = d.createElement('style'); st.id = 'no-fouc'; st.textContent = '*{transition:none!important}'; d.head.appendChild(st); d.body.style.visibility = 'hidden'; if (t === 'dark') { d.body.classList.add('dark-mode'); } var accent = localStorage.getItem('hdf-accent') || 'accent-amber'; if (accent) d.body.classList.add(accent); var meta = d.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', t === 'dark' ? '#0f0f11' : '#8B4513'); d.body.style.visibility = ''; st.remove(); } catch (e) { } })();</script>
  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <div class="admin-profile">
        <div class="avatar" aria-hidden="true">A</div>
        <div class="profile-meta">
          <div class="name" id="admin-user-name">Admin</div>
          <a class="open-profile" href="/profile.html" target="_blank" rel="noopener">Open Profile ↗</a>
        </div>
      </div>
      <nav class="admin-nav">
        <a class="nav-link" href="/admin.html"><span class="nav-icon"><i data-feather="grid"></i></span><span
            class="nav-label">Dashboard</span></a>
        <a class="nav-link" href="/admin-users.html"><span class="nav-icon"><i data-feather="users"></i></span><span
            class="nav-label">Users</span></a>
        <a class="nav-link" href="/admin-orders.html"><span class="nav-icon"><i
              data-feather="file-text"></i></span><span class="nav-label">Orders</span></a>
        <a class="nav-link" href="/admin-messages.html"><span class="nav-icon"><i data-feather="mail"></i></span><span
            class="nav-label">Messages</span></a>
        <a class="nav-link" href="/admin-products.html"><span class="nav-icon"><i
              data-feather="shopping-bag"></i></span><span class="nav-label">Products</span></a>
        <a class="nav-link active" href="/admin-notifications.html"><span class="nav-icon"><i
              data-feather="bell"></i></span><span class="nav-label">Notifications</span></a>
      </nav>
    </aside>
    <div class="admin-main">
      <div class="admin-wrap">
        <div class="admin-header">
          <h1><span class="brand">Admin</span> — Notifications</h1>
          <div class="admin-actions">
            <button class="btn" id="btn-refresh">Refresh</button>
            <button class="btn" id="btn-logout">Logout</button>
            <a class="btn primary" href="/">Go to site</a>
          </div>
        </div>

        <div class="panel">
          <h2>Recent Activity</h2>
          <div class="content">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Type</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody id="notif-body"></tbody>
              </table>
            </div>
            <div class="notice">Recent activity combined from Orders, Messages, and Registrations.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function api(path, opts = {}) {
      const res = await fetch(path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function ensureAdmin() {
      const auth = await api('/api/check-auth');
      if (!auth.authenticated || auth.user.role !== 'admin') { try { await api('/api/admin/check'); } catch (e) { } location.href = '/login.html'; return false; }
      try { document.getElementById('admin-user-name').textContent = auth.user?.full_name || auth.user?.username || 'Admin'; } catch { }
      return true;
    }
    (function highlight() {
      const path = location.pathname.replace(/\\+/g, '/');
      document.querySelectorAll('.admin-sidebar .nav-link').forEach(a => {
        const href = a.getAttribute('href');
        const matches = (href === '/' ? path === '/' : path.endsWith(href));
        a.classList.toggle('active', matches);
      });
      try { if (window.feather) feather.replace(); } catch { }
    })();
    function row(n) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td data-label="Time">${new Date(n.time).toLocaleString()}</td><td data-label="Type">${n.type}</td><td data-label="Message">${n.text}</td>`;
      return tr;
    }
    async function loadNotifs() {
      const tbody = document.getElementById('notif-body');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Loading notifications...</td></tr>';

      let all = [];
      try {
        const [ordersRes, msgsRes, usersRes] = await Promise.all([
          api('/api/admin/orders').catch(() => ({ orders: [] })),
          api('/api/admin/messages').catch(() => ({ messages: [] })),
          api('/api/admin/users').catch(() => ({ users: [] }))
        ]);

        const orders = (ordersRes.orders || []).map(o => ({
          time: new Date(o.created_at).getTime(),
          type: '<span style="color:var(--primary);font-weight:600;">Order</span>',
          text: `New order from ${o.full_name || o.email || 'Guest'} for ₹${(o.total || 0).toLocaleString('en-IN')}`
        }));

        const msgs = (msgsRes.messages || []).map(m => ({
          time: new Date(m.created_at).getTime(),
          type: '<span style="color:var(--warn);font-weight:600;">Message</span>',
          text: `New message from ${m.name}: "${m.subject}"`
        }));

        const users = (usersRes.users || []).map(u => ({
          time: new Date(u.created_at).getTime(),
          type: '<span style="color:var(--accent);font-weight:600;">User</span>',
          text: `New registration: ${u.username}`
        }));

        all = [...orders, ...msgs, ...users].sort((a, b) => b.time - a.time).slice(0, 50); // Get latest 50
      } catch (e) {
        console.warn('Failed to load notifications', e);
      }

      tbody.innerHTML = '';
      if (all.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No recent activity found.</td></tr>';
      } else {
        all.forEach(n => tbody.appendChild(row(n)));
      }
    }
    async function refresh() { await loadNotifs(); }
    document.getElementById('btn-refresh').addEventListener('click', refresh);
    document.getElementById('btn-logout').addEventListener('click', async () => { try { await api('/api/logout', { method: 'POST' }); } catch (e) { } location.href = '/login.html'; });
    (async () => { if (await ensureAdmin()) await refresh(); })();
  </script>
  <script src="js/app.js"></script>
  <script src="js/mobile-menu.js"></script>
</body>

</html>

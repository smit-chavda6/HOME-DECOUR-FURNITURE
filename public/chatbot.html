<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecorBot - AI Shopping Assistant | Home Decor Furniture</title>
    <meta name="description" content="Chat with DecorBot, your AI shopping assistant for Home Decor Furniture. Get product recommendations, track orders, and more.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/chatbot.css">
    <link rel="stylesheet" href="CSS/responsive.css">
    <style>
        /* Standalone chatbot page styles */
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f0;
            font-family: 'Inter', 'Jost', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body.dark-mode {
            background: #0f0f11;
        }

        .chatbot-page-wrapper {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        .chatbot-page-wrapper h1 {
            font-size: 2rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        body.dark-mode .chatbot-page-wrapper h1 { color: #e5e5e5; }
        .chatbot-page-wrapper p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        body.dark-mode .chatbot-page-wrapper p { color: #9ca3af; }
        .chatbot-page-wrapper .back-link {
            display: inline-block;
            color: #8B4513;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 24px;
            border: 2px solid #8B4513;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .chatbot-page-wrapper .back-link:hover {
            background: #8B4513;
            color: white;
        }

        /* On this page, auto-open the chatbot */
        .chat-window { opacity: 1 !important; transform: none !important; pointer-events: all !important; }

        /* Dark mode loading dots override */
        body.dark-mode .loading-dots div,
        body.dark-mode .typing-dots span {
            background-color: #f0b35f;
        }
        body.dark-mode .chat-messages::-webkit-scrollbar { width: 10px; }
        body.dark-mode .chat-messages::-webkit-scrollbar-track { background: #0c0d10; }
        body.dark-mode .chat-messages::-webkit-scrollbar-thumb { background-color: #2a2f36; border-radius: 6px; border: 2px solid #0c0d10; }
        body.dark-mode .chat-messages { scrollbar-color: #2a2f36 #0c0d10; }
    </style>

    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () {
        (window.siq = window.siq || []).push(arguments);
      };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <script>(function(){try{var d=document;var t=localStorage.getItem('hdf-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}var st=d.createElement('style');st.id='no-fouc';st.textContent='*{transition:none!important}';d.head.appendChild(st);d.body.style.visibility='hidden';if(t==='dark'){d.body.classList.add('dark-mode');}var accent=localStorage.getItem('hdf-accent')||'accent-amber';if(accent) d.body.classList.add(accent);var meta=d.querySelector('meta[name="theme-color"]');if(meta) meta.setAttribute('content', t==='dark' ? '#0f0f11' : '#8B4513');d.body.style.visibility='';st.remove();}catch(e){}})();</script>

    <div class="chatbot-page-wrapper">
        <h1>&#127968; DecorBot</h1>
        <p>Your AI-powered shopping assistant. Ask about products, prices, budgets, orders, shipping, and more!</p>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <script src="js/chatbot.js"></script>
    <script>
        // Auto-open the chat window on this page
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var win = document.getElementById('chatWindow');
                if (win) win.classList.add('active');
                var input = document.getElementById('chatInput');
                if (input) input.focus();
            }, 300);
        });
    </script>
    <script src="js/mobile-menu.js"></script>
</body>
</html>
